<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老板的专属项目中心 | 阿虾出品</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="container">
        <header>
            <div class="profile">
                <div class="avatar">🦞</div>
                <h1>老板的项目中心</h1>
                <p class="subtitle">由阿虾为您精心整理的数字资产</p>
            </div>
        </header>

        <main>
            <div class="grid">
                <!-- 天气项目 -->
                <a href="https://sondanghung932-coder.github.io/weather-world/" target="_blank" class="card">
                    <div class="card-icon"><i data-lucide="cloud-sun"></i></div>
                    <div class="card-content">
                        <h3>玻璃拟态天气预报</h3>
                        <p>采用 Glassmorphism 设计风格，实时抓取 Open-Meteo 数据，支持全球城市搜索与定位。</p>
                        <span class="tag">前端项目</span>
                    </div>
                    <div class="card-arrow"><i data-lucide="external-link"></i></div>
                </a>

                <!-- GitHub 个人主页 -->
                <a href="https://github.com/sondanghung932-coder" target="_blank" class="card">
                    <div class="card-icon"><i data-lucide="github"></i></div>
                    <div class="card-content">
                        <h3>GitHub 个人主页</h3>
                        <p>老板的代码基地，存放着所有的开源项目与自动化脚本。</p>
                        <span class="tag">源码仓库</span>
                    </div>
                    <div class="card-arrow"><i data-lucide="external-link"></i></div>
                </a>

                <!-- OpenClaw 控制台 -->
                <a href="http://127.0.0.1:18789" target="_blank" class="card">
                    <div class="card-icon"><i data-lucide="terminal"></i></div>
                    <div class="card-content">
                        <h3>OpenClaw 本地控制台</h3>
                        <p>管理阿虾的网关、监控任务看板与配置 API 密钥的核心枢纽。</p>
                        <span class="tag">管理后台</span>
                    </div>
                    <div class="card-arrow"><i data-lucide="external-link"></i></div>
                </a>
            </div>
        </main>

        <footer>
            <p>© 2026 Designed with ❤️ by 阿虾 🦞</p>
        </footer>
    </div>
    <script>
        lucide.createIcons();
    </script>
