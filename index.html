<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL | 老板的数字矩阵</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Noto+Sans+SC:wght@400;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="scanlines"></div>
    <div class="noise"></div>
    
    <div class="bg-container">
        <div class="glitch-box"></div>
    </div>

    <div class="container">
        <header>
            <div class="status-bar">
                <span class="blink">●</span> SYSTEM ONLINE | LOBSTER_CORE_v2.0
            </div>
            <div class="glitch-wrapper">
                <h1 class="glitch" data-text="LOBSTER MATRIX">LOBSTER MATRIX</h1>
            </div>
            <p class="subtitle">>> 专属项目阵列已就绪</p>
        </header>

        <main>
            <div class="grid">
                <!-- 我们自己写的项目：玻璃拟态天气预报 -->
                <a href="https://sondanghung932-coder.github.io/weather-world/" target="_blank" class="card">
                    <div class="card-edge top-left"></div>
                    <div class="card-edge bottom-right"></div>
                    <div class="card-icon"><i data-lucide="cloud-lightning"></i></div>
                    <div class="card-content">
                        <div class="category">SELF_DEVELOPED</div>
                        <h3>玻璃拟态天气系统</h3>
                        <p>由阿虾与老板共同开发的第一个作品。采用高级 Glassmorphism 视觉语言，对接 Open-Meteo 实时气象协议。</p>
                        <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
                    </div>
                </a>

                <!-- GitHub 仓库 (我们代码的所在地) -->
                <a href="https://github.com/sondanghung932-coder" target="_blank" class="card purple">
                    <div class="card-edge top-left"></div>
                    <div class="card-edge bottom-right"></div>
                    <div class="card-icon"><i data-lucide="git-branch"></i></div>
                    <div class="card-content">
                        <div class="category">CODE_REPO</div>
                        <h3>GITHUB 源码库</h3>
                        <p>存放所有“阿虾出品”项目的核心仓库，包含天气预报、个人中心等所有源码资产。</p>
                        <div class="progress-bar"><div class="progress-fill" style="width: 85%"></div></div>
                    </div>
                </a>
            </div>
        </main>

        <footer>
            <div class="terminal-footer">
                <span class="cmd">admin@lobster:~$</span> <span class="typing">cleaning_finished --only_self_projects</span>
            </div>
        </footer>
    </div>

    <script>
        lucide.createIcons();
        setInterval(() => {
            document.querySelectorAll('.progress-fill').forEach(el => {
                let current = parseInt(el.style.width);
                let drift = Math.floor(Math.random() * 5) - 2;
                let next = Math.max(70, Math.min(100, current + drift));
                el.style.width = next + '%';
            });
        }, 3000);
    </script>
</body>
</html>
